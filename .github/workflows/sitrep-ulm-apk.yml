name: Build Sitrep Ulm APK

on:
  push:
    paths:
      - "sitrep-ulm/**"
      - ".github/workflows/sitrep-ulm-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitrep-ulm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sitrep-ulm-debug-apk
          path: sitrep-ulm/app/build/outputs/apk/debug/app-debug.apk
